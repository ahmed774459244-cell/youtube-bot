# Bu fayl telegram-bot-api serverini (2GB fayl limiti uchun) Docker orqali ishga tushiradi.
# Windows'dagidek qo'lda .exe qidirish shart emas — Docker o'zi hammasini yuklab, ishga tushiradi.
#
# Ishlatish:
#   1. .env faylida TELEGRAM_API_ID va TELEGRAM_API_HASH to'ldirilgan bo'lsin
#   2. docker compose up -d
#
# Server http://localhost:8081 da ishga tushadi — bot.py shu manzilga avtomatik ulanadi
# (agar .env faylida USE_LOCAL_API_SERVER=true bo'lsa).

services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: telegram-bot-api
    restart: always
    environment:
      TELEGRAM_API_ID: "${TELEGRAM_API_ID}"
      TELEGRAM_API_HASH: "${TELEGRAM_API_HASH}"
      TELEGRAM_LOCAL: "true"
    ports:
      - "8081:8081"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api

volumes:
  telegram-bot-api-data:
